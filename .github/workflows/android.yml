name: OFMtouch Android Nightly 0.3.6

on:
  workflow_dispatch:
  push:
    branches:
      - android/migration
      - major/world-simulation

concurrency:
  group: android-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Linux Rust build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - name: Install frontend dependencies
        run: npm ci

      - name: Portrait diversity regression guard
        run: node scripts/check-portrait-diversity.mjs

      - name: Frontend regression tests
        run: npm test

      - name: Frontend lint
        run: npm run lint

      - name: Rust workspace tests
        working-directory: src-tauri
        run: cargo test --workspace --all-targets --locked

      - name: Frontend production build
        env:
          OFM_CHANNEL: nightly
          VITE_APP_BUILD_NUMBER: ${{ github.run_number }}
        run: npm run build

      - name: Initialize Android project if needed
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npx tauri android init --ci
          fi

      - name: Build ARM64 debug APK
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          OFM_CHANNEL: nightly
          VITE_APP_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          # Keep every nightly installable over the previous v0.3.6 build.
          export OFM_ANDROID_VERSION_CODE=$((3006000 + GITHUB_RUN_NUMBER))
          node -e 'require("fs").writeFileSync("tauri.android.nightly.conf.json", JSON.stringify({bundle:{android:{versionCode:Number(process.env.OFM_ANDROID_VERSION_CODE)}}}))'
          npx tauri android build --debug --apk --target aarch64 --config tauri.android.nightly.conf.json

      - name: Verify APK signature and ARM64 payload
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "APK: $APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          PACKAGE_LINE="$("$AAPT" dump badging "$APK" | sed -n '1p')"
          echo "$PACKAGE_LINE"
          [[ "$PACKAGE_LINE" == *"name='com.tranquilmt.openfootmanager'"* ]]
          [[ "$PACKAGE_LINE" == *"versionName='0.3.6'"* ]]
          [[ "$PACKAGE_LINE" == *"versionCode='$((3006000 + GITHUB_RUN_NUMBER))'"* ]]
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/.*\.so' >/dev/null
          if unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|x86|x86_64)/.*\.so'; then
            echo 'Unexpected non-ARM64 native libraries found'
            exit 1
          fi
          mkdir -p dist-apk
          cp "$APK" "dist-apk/OFMtouch-0.3.6-Build${GITHUB_RUN_NUMBER}-NightlyPreRelease.apk"
          sha256sum "dist-apk/OFMtouch-0.3.6-Build${GITHUB_RUN_NUMBER}-NightlyPreRelease.apk" | tee "dist-apk/OFMtouch-0.3.6-Build${GITHUB_RUN_NUMBER}-NightlyPreRelease.apk.sha256"

      - name: Upload installable ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: OFMtouch-0.3.6-Build${{ github.run_number }}-NightlyPreRelease
          path: dist-apk/*
          if-no-files-found: error
