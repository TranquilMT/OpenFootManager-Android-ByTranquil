name: OFMtouch Android Nightly 0.6.2 Gameplay Polish

on:
  workflow_dispatch:
  push:
    branches:
      - android/migration
      - major/world-simulation
      - phase5-manager-career
      - phase6-board-dressing-room
      - phase6-gameplay-polish
      - release/0.6.2-career-polish

permissions:
  contents: write

concurrency:
  group: android-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android

      - name: Install Linux Rust build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - name: Install frontend dependencies
        run: npm ci

      - name: Portrait diversity regression guard
        run: node scripts/check-portrait-diversity.mjs

      - name: Source quality guard
        run: npm run quality:check

      - name: Frontend regression tests
        run: npm test

      - name: Frontend lint
        run: npm run lint

      - name: Frontend formatting
        run: npm run format:check

      - name: Translation coverage
        run: node scripts/audit-i18n.mjs --check

      - name: Rust workspace tests
        working-directory: src-tauri
        run: cargo test --workspace --all-targets --locked

      - name: Frontend production build
        env:
          OFM_CHANNEL: nightly
          VITE_APP_BUILD_NUMBER: ${{ github.run_number }}
        run: npm run build

      - name: Initialize Android project if needed
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npx tauri android init --ci
          fi

      - name: Build ARM64 APK for persistent signing
        env:
          RUSTFLAGS: "-C debuginfo=0"
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          OFM_CHANNEL: nightly
          VITE_APP_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          # Keep every nightly installable over the previous v0.6.2 build.
          export OFM_ANDROID_VERSION_CODE=$((6200000 + GITHUB_RUN_NUMBER))
          node -e 'require("fs").writeFileSync("tauri.android.nightly.conf.json", JSON.stringify({bundle:{android:{versionCode:Number(process.env.OFM_ANDROID_VERSION_CODE)}}}))'
          npx tauri android build --debug --apk --target aarch64 --config tauri.android.nightly.conf.json

      - name: Verify APK signature and ARM64 payload
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "APK: $APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          PACKAGE_LINE="$("$AAPT" dump badging "$APK" | sed -n '1p')"
          echo "$PACKAGE_LINE"
          [[ "$PACKAGE_LINE" == *"name='com.tranquilmt.openfootmanager'"* ]]
          [[ "$PACKAGE_LINE" == *"versionName='0.6.2'"* ]]
          [[ "$PACKAGE_LINE" == *"versionCode='$((6200000 + GITHUB_RUN_NUMBER))'"* ]]
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          # A debug build is only an intermediate artifact. Final delivery is signed
          # with the persistent release keystore and its certificate is checked.
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/.*\.so' >/dev/null
          if unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|x86|x86_64)/.*\.so'; then
            echo 'Unexpected non-ARM64 native libraries found'
            exit 1
          fi
          mkdir -p dist-apk
          cp "$APK" "dist-apk/OFMtouch-0.6.2-Gameplay-Polish-Build${GITHUB_RUN_NUMBER}-CI-INTERMEDIATE.apk"
          sha256sum "dist-apk/OFMtouch-0.6.2-Gameplay-Polish-Build${GITHUB_RUN_NUMBER}-CI-INTERMEDIATE.apk" | tee "dist-apk/OFMtouch-0.6.2-Gameplay-Polish-Build${GITHUB_RUN_NUMBER}-CI-INTERMEDIATE.apk.sha256"

      - name: Upload ARM64 APK for persistent signing
        uses: actions/upload-artifact@v4
        with:
          name: OFMtouch-0.6.2-Gameplay-Polish-Build${{ github.run_number }}-CI-INTERMEDIATE
          path: dist-apk/*
          if-no-files-found: error

      - name: Sign and publish update when persistent signing secrets are configured
        env:
          RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_KEYSTORE" ] || [ -z "$RELEASE_STORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo 'Persistent signing secrets are not configured; the intermediate APK requires local release signing.'
            exit 0
          fi
          KEYSTORE="$RUNNER_TEMP/ofmtouch-release.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > "$KEYSTORE"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          INPUT="$(find dist-apk -name '*.apk' | head -n 1)"
          mkdir -p release-assets
          OUTPUT="release-assets/OFMtouch-0.6.2-Gameplay-Polish-Build${GITHUB_RUN_NUMBER}-SIGNED.apk"
          "$ZIPALIGN" -p -f 4 "$INPUT" "$OUTPUT"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias "$RELEASE_KEY_ALIAS" --ks-pass env:RELEASE_STORE_PASSWORD --key-pass env:RELEASE_KEY_PASSWORD "$OUTPUT"
          "$APKSIGNER" verify --verbose --print-certs "$OUTPUT" | tee "$RUNNER_TEMP/ofmtouch-signature.txt"
          grep -qi '3f0d869bfaa5f7c78a7d2a9474d44424ae4f4399e64d76b6fb9e691695412e60' "$RUNNER_TEMP/ofmtouch-signature.txt"
          git archive --format=zip --prefix=OFMtouch-0.6.2/ HEAD > "release-assets/OFMtouch-0.6.2-Build${GITHUB_RUN_NUMBER}-SOURCE.zip"
          (cd release-assets && sha256sum *.apk *.zip > SHA256SUMS.txt)
          python - <<'PYNOTES'
          from pathlib import Path
          readme = Path('README.md').read_text()
          notes = readme.split('### v0.6.2 — Career & Gameplay Polish\n', 1)[1].split('## Download & Play', 1)[0].strip()
          Path('release-notes.txt').write_text(notes + '\n\nAndroid ARM64. Install over your existing OFMtouch app to keep your saves. Full matching source and SHA-256 checksums are included.\n')
          PYNOTES
          gh release create "v0.6.2-build${GITHUB_RUN_NUMBER}" release-assets/* --target "$GITHUB_SHA" --title "OFMtouch v0.6.2 — Career & Gameplay Polish · Build ${GITHUB_RUN_NUMBER}" --notes-file release-notes.txt --prerelease
