name: Match Engine V2 Refinement
on:
  push:
    branches: [fix/match-engine-v2-refinement]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: engine-v2-refinement-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: engine-v2-refinement
      - name: Prove new regressions fail on the released baseline
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/ofm-engine-baseline 938f6057a602c1b9ffefa1663bb7f76f06c321f9
          cp src-tauri/crates/engine/src/live_match/refinement_tests.rs /tmp/ofm-engine-baseline/src-tauri/crates/engine/src/live_match/
          sed -i '1i #[cfg(test)]\nmod refinement_tests;\n' /tmp/ofm-engine-baseline/src-tauri/crates/engine/src/live_match/mod.rs
          set +e
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/src-tauri/target" cargo test --manifest-path /tmp/ofm-engine-baseline/src-tauri/Cargo.toml -p engine --lib refinement_ --locked > baseline-regressions.log 2>&1
          result=$?
          set -e
          cat baseline-regressions.log
          test "$result" -eq 101
          grep -F 'test result: FAILED. 0 passed; 14 failed;' baseline-regressions.log
      - name: Format engine changes with the pinned compiler
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -p engine
          if ! git diff --quiet -- src-tauri/crates/engine; then
            git config user.name 'TranquilMT'
            git config user.email 'williamutting16@gmail.com'
            git add src-tauri/crates/engine
            git commit -m 'style(engine): apply pinned Rust formatter to refinements'
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: All engine unit and integration tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -p engine --all-targets --locked
      - name: Strict engine lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -p engine --all-targets --locked -- -D warnings
  full-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install workspace system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: android-polish
      - run: npm ci
      - run: npm test -- --maxWorkers=2
      - run: npm run build
      - run: npm run quality:check
      - run: node scripts/audit-i18n.mjs --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --all-targets --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets --locked
