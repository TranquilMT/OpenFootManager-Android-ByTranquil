name: OFMtouch 0.7.3 Integrated Gameplay Checks

on:
  push:
    branches: [feat/0.7.3-integrated-gameplay]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrated-gameplay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:portraits

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: integrated-gameplay
      - name: Workspace unit and integration tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --all-targets --locked
      - name: Workspace lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets --locked
