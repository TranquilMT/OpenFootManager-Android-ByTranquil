name: Phase 5 Manager Career checks

on:
  push:
    branches: [phase5-manager-career]
    paths: [.github/workflows/phase5-check.yml, src-tauri/**]

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Rust build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev pkg-config
      - name: Test Rust workspace
        working-directory: src-tauri
        run: cargo test --workspace --all-targets --locked
      - name: Compile Rust workspace
        working-directory: src-tauri
        run: cargo check --workspace --locked
