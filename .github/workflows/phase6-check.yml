name: Phase 6 Board and Dressing Room checks

on:
  push:
    branches: [phase6-board-dressing-room, phase6-gameplay-polish]
    paths: [.github/workflows/phase6-check.yml, src-tauri/**, src/**, package.json, package-lock.json, quality-baseline.json]
  pull_request:
    paths: [.github/workflows/phase6-check.yml, src-tauri/**, src/**, package.json, package-lock.json, quality-baseline.json]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run quality:check
      - run: npm run build
      - run: npm test
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install Linux Rust build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev pkg-config
      - name: Test Rust workspace
        working-directory: src-tauri
        run: cargo test --workspace --all-targets --locked
      - name: Compile Rust workspace
        working-directory: src-tauri
        run: cargo check --workspace --locked
