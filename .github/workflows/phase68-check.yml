name: OFMtouch 0.6.8 Phase Polish Checks
on:
  push:
    branches: [release/0.6.8-phase-polish]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format verification output
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          npm exec --no -- biome format --write src package.json package-lock.json
          git diff > formatting.patch
      - name: Frontend quality and regression checks
        run: |
          npm run quality:check
          npm run quality:baseline
          npm run lint
          npm run format:check
          npm run test:portraits
          npm test -- --maxWorkers=2
          npm run build
          npm run audit:i18n
      - name: Preserve verified formatting and quality improvements
        run: |
          if ! git diff --quiet -- src src-tauri package.json package-lock.json quality-baseline.json; then
            git config user.name "OFMtouch verification"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src src-tauri package.json package-lock.json quality-baseline.json
            git commit -m "chore(style): format 0.6.8 sources and record quality improvements"
            git push origin HEAD:release/0.6.8-phase-polish
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: economy-formatting
          path: formatting.patch
      - name: Backend economy regression suite
        if: always()
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -p domain -p engine -p ofm_core -p db --all-targets --no-fail-fast -- --nocapture
      - name: Backend lint
        if: always()
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -p domain -p engine -p ofm_core -p db --all-targets -- -D warnings

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - name: Desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: App command and MCP regression suite
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -p openfootmanager --lib --features mcp --no-fail-fast
      - name: App and MCP lint
        if: always()
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -p openfootmanager --all-targets --features mcp -- -D warnings
