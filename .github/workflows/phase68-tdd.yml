name: Phase 6.8 regression reproduction
on:
  push:
    branches: [release/0.6.8-phase-polish]
    paths: ['.github/workflows/phase68-tdd.yml']
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml -p ofm_core --lib --no-fail-fast
