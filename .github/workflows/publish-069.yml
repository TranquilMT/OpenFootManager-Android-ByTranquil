name: Publish OFMtouch 0.6.9 Build 358
on:
  push:
    branches: [release/0.6.9-publish-build358]
permissions:
  contents: write
  actions: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed release package
        run: |
          set -euo pipefail
          cat release-parts/part-*.bin > release-assets.zip
          echo '6c7b5214f528a9614c82264cb6591ac7809a973bd1b20e9b190bb5ab5f4775f1  release-assets.zip' | sha256sum -c -
          mkdir release-assets
          unzip -q release-assets.zip -d release-assets
          cd release-assets
          sha256sum -c OFMtouch-0.6.9-Build358-SHA256SUMS.txt
          APK=OFMtouch-0.6.9-Season-Economy-Fixes-Build358-SIGNED.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > signature.txt
          grep -qi '3f0d869bfaa5f7c78a7d2a9474d44424ae4f4399e64d76b6fb9e691695412e60' signature.txt
          rm signature.txt
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          PACKAGE_LINE="$("$AAPT" dump badging "$APK" | sed -n '1p')"
          [[ "$PACKAGE_LINE" == *"name='com.tranquilmt.openfootmanager'"* ]]
          [[ "$PACKAGE_LINE" == *"versionName='0.6.9'"* ]]
          [[ "$PACKAGE_LINE" == *"versionCode='6900358'"* ]]
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          "$ZIPALIGN" -c -p 4 "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/.*\.so' >/dev/null
          if unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|x86|x86_64)/.*\.so'; then exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: 719c848c8e62ef8080adb16d04bbd09587c21e52
          path: verified-source
          persist-credentials: false
      - name: Verify matching complete source archive
        run: |
          test "$(git -C verified-source rev-parse HEAD)" = 719c848c8e62ef8080adb16d04bbd09587c21e52
          git -C verified-source archive --format=zip --prefix=OFMtouch-0.6.9/ HEAD > expected-source.zip
          mkdir expected-source delivered-source
          unzip -q expected-source.zip -d expected-source
          unzip -q release-assets/OFMtouch-0.6.9-Build358-SOURCE.zip -d delivered-source
          diff -r expected-source delivered-source
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.6.9-build358 release-assets/* --target 719c848c8e62ef8080adb16d04bbd09587c21e52 --title "OFMtouch v0.6.9 — Season Economy Fixes · Build 358" --notes-file release-assets/OFMtouch-0.6.9-Build358-Release-Notes.md --latest
      - name: Refresh release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-manifest.yml --ref main -f release_tag=v0.6.9-build358
      - uses: actions/upload-artifact@v4
        with:
          name: OFMtouch-0.6.9-Build358-RELEASE
          path: release-assets/*
          if-no-files-found: error
