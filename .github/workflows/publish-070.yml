name: Publish OFMtouch 0.7.0 Build 359
on:
  push:
    branches: [stage/0.7.0-publish-build359]
permissions:
  contents: write
  actions: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require successful final release validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/37667513602 --jq .conclusion)" = success
      - name: Verify signed release package
        run: |
          set -euo pipefail
          cat release-parts/part-*.bin > release-assets.zip
          echo 'c50f5c37f2bace39200352e32754d25d850ca296452faf56a8a60a313d630a12  release-assets.zip' | sha256sum -c -
          mkdir release-assets
          unzip -q release-assets.zip -d release-assets
          cd release-assets
          sha256sum -c OFMtouch-0.7.0-Build359-SHA256SUMS.txt
          APK=OFMtouch-0.7.0-Match-Engine-V2-Build359-SIGNED.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > signature.txt
          grep -qi '3f0d869bfaa5f7c78a7d2a9474d44424ae4f4399e64d76b6fb9e691695412e60' signature.txt
          rm signature.txt
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          PACKAGE_LINE="$("$AAPT" dump badging "$APK" | sed -n '1p')"
          [[ "$PACKAGE_LINE" == *"name='com.tranquilmt.openfootmanager'"* ]]
          [[ "$PACKAGE_LINE" == *"versionName='0.7.0'"* ]]
          [[ "$PACKAGE_LINE" == *"versionCode='7000359'"* ]]
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          "$ZIPALIGN" -c -p 4 "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/.*\.so' >/dev/null
          if unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|x86|x86_64)/.*\.so'; then exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: 8697541be7bfd1115c2a425d1cabf53b8dc020db
          path: verified-source
          persist-credentials: false
      - name: Verify matching complete source archive
        run: |
          test "$(git -C verified-source rev-parse HEAD)" = 8697541be7bfd1115c2a425d1cabf53b8dc020db
          git -C verified-source archive --format=zip --prefix=OFMtouch-0.7.0/ HEAD > expected-source.zip
          mkdir expected-source delivered-source
          unzip -q expected-source.zip -d expected-source
          unzip -q release-assets/OFMtouch-0.7.0-Build359-SOURCE.zip -d delivered-source
          diff -r expected-source delivered-source
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.7.0-build359 release-assets/* --target 8697541be7bfd1115c2a425d1cabf53b8dc020db --title "OFMtouch v0.7.0 — Match Engine V2 · Build 359" --notes-file release-assets/OFMtouch-0.7.0-Build359-Release-Notes.md --latest
      - name: Refresh release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-manifest.yml --ref main -f release_tag=v0.7.0-build359
      - uses: actions/upload-artifact@v4
        with:
          name: OFMtouch-0.7.0-Build359-RELEASE
          path: release-assets/*
          if-no-files-found: error
