name: Publish OFMtouch 0.7.1 Build 360
on:
  push:
    branches: [stage/0.7.1-publish-build360]
permissions:
  contents: write
  actions: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require successful final release validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/37737503808 --jq .conclusion)" = success
      - name: Verify signed release package
        run: |
          set -euo pipefail
          cat release-parts/part-*.bin > release-assets.zip
          echo '7118a922cc74b8dab73af3a417adebc0652fc1c2f592c7d6ddb221dfc0afffdc  release-assets.zip' | sha256sum -c -
          mkdir release-assets
          unzip -q release-assets.zip -d release-assets
          cd release-assets
          sha256sum -c OFMtouch-0.7.1-Build360-SHA256SUMS.txt
          APK=OFMtouch-0.7.1-Match-Engine-V2-Build360-SIGNED.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > signature.txt
          grep -qi '3f0d869bfaa5f7c78a7d2a9474d44424ae4f4399e64d76b6fb9e691695412e60' signature.txt
          rm signature.txt
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          PACKAGE_LINE="$("$AAPT" dump badging "$APK" | sed -n '1p')"
          [[ "$PACKAGE_LINE" == *"name='com.tranquilmt.openfootmanager'"* ]]
          [[ "$PACKAGE_LINE" == *"versionName='0.7.1'"* ]]
          [[ "$PACKAGE_LINE" == *"versionCode='7100360'"* ]]
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          "$ZIPALIGN" -c -p 4 "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/.*\.so' >/dev/null
          if unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|x86|x86_64)/.*\.so'; then exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: 0bd6364a6c3c5ebff141c5ba87bc60198abba91a
          path: verified-source
          persist-credentials: false
      - name: Verify matching complete source archive
        run: |
          test "$(git -C verified-source rev-parse HEAD)" = 0bd6364a6c3c5ebff141c5ba87bc60198abba91a
          git -C verified-source archive --format=zip --prefix=OFMtouch-0.7.1/ HEAD > expected-source.zip
          mkdir expected-source delivered-source
          unzip -q expected-source.zip -d expected-source
          unzip -q release-assets/OFMtouch-0.7.1-Build360-SOURCE.zip -d delivered-source
          diff -r expected-source delivered-source
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.7.1-build360 release-assets/* --target 0bd6364a6c3c5ebff141c5ba87bc60198abba91a --title "OFMtouch v0.7.1 — Match Engine V2 · Build 360" --notes-file release-assets/OFMtouch-0.7.1-Build360-Release-Notes.md --latest
      - name: Refresh release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-manifest.yml --ref main -f release_tag=v0.7.1-build360
      - uses: actions/upload-artifact@v4
        with:
          name: OFMtouch-0.7.1-Build360-RELEASE
          path: release-assets/*
          if-no-files-found: error
