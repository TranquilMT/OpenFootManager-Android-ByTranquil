name: OFMtouch Nightly Regression Gate

on:
  push:
    branches:
      - android/migration
  workflow_dispatch:

concurrency:
  group: regression-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Rust build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - name: Install frontend dependencies
        run: npm ci

      - name: Portrait diversity regression guard
        run: node scripts/check-portrait-diversity.mjs

      - name: TypeScript and production build
        run: npm run build

      - name: Frontend regression tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Rust workspace tests
        working-directory: src-tauri
        run: cargo test --workspace --all-targets --locked

      - name: Rust compile check
        working-directory: src-tauri
        run: cargo check --workspace --locked

      - name: Verify player-facing version consistency
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'v0.3.1' README.md
          grep -q 'NightlyPreRelease' README.md

      - name: Regression gate passed
        run: echo 'All Nightly regression gates passed.'
