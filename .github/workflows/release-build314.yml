name: Publish complete OFMtouch build 314

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-build314.yml]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified Android artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download 36365617607 --repo "$GITHUB_REPOSITORY" \
            --name OFMtouch-0.3.5-Build314-NightlyPreRelease --dir release
          cd release
          echo '57368404f84ff02713ba1f0938a6fb017ae8ebd18466ef95e67748f57ea22b5f  OFMtouch-0.3.5-Build314-NightlyPreRelease.apk' | sha256sum -c -

      - name: Archive matching complete source and full package
        run: |
          set -euo pipefail
          git archive --format=zip \
            --output=release/OFMtouch-Build314-source.zip \
            7159d091721a99b88219971099c21530addba92e
          cd release
          cat > OFMtouch-Build314-README.txt <<'EOF'
          OFMtouch v0.3.5 Build 314 — complete Android delivery.
          Install the APK on an ARM64 Android phone. The source ZIP includes all
          tracked game code and assets at 7159d091721a99b88219971099c21530addba92e.
          Build dependencies and generated outputs are recreated by the Android workflow.
          The Android CI tests, package metadata, signature and ARM64 checks passed.
          Inbox reading still needs confirmation on a physical phone.
          EOF
          sha256sum OFMtouch-0.3.5-Build314-NightlyPreRelease.apk \
            OFMtouch-Build314-source.zip > OFMtouch-Build314-SHA256.txt
          zip -0 -q OFMtouch-Build314-complete.zip \
            OFMtouch-0.3.5-Build314-NightlyPreRelease.apk \
            OFMtouch-Build314-source.zip OFMtouch-Build314-SHA256.txt \
            OFMtouch-Build314-README.txt
          unzip -t OFMtouch-Build314-complete.zip | tail -n 1
          sha256sum OFMtouch-Build314-complete.zip >> OFMtouch-Build314-SHA256.txt

      - name: Publish prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.3.5-build314 \
            release/OFMtouch-0.3.5-Build314-NightlyPreRelease.apk \
            release/OFMtouch-Build314-source.zip \
            release/OFMtouch-Build314-complete.zip \
            release/OFMtouch-Build314-SHA256.txt \
            release/OFMtouch-Build314-README.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target 7159d091721a99b88219971099c21530addba92e \
            --title 'OFMtouch v0.3.5 Build 314 — Android ARM64' \
            --notes 'Full Android APK, matching complete source, combined package and checksums. Build 314 fixes the mobile Inbox reading layout; physical-device confirmation remains pending.' \
            --prerelease
