name: Publish complete OFMtouch build 315

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-build315.yml]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified Android artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download 36474634670 --repo "$GITHUB_REPOSITORY" \
            --name OFMtouch-0.3.6-Build315-NightlyPreRelease --dir release
          cd release
          echo '9acf6a53e034d747e964b74bbf137da0110f37817f2196738b8f83ac758879a1  OFMtouch-0.3.6-Build315-NightlyPreRelease.apk' | sha256sum -c -

      - name: Archive matching complete source and full package
        run: |
          set -euo pipefail
          git archive --format=zip \
            --output=release/OFMtouch-Build315-source.zip \
            63e5bd4474af7de43caa73381c1c9c061955a4af
          cd release
          cat > OFMtouch-Build315-README.txt <<'EOF'
          OFMtouch v0.3.6 Build 315 — complete Android delivery.
          Install the APK on an ARM64 Android phone. The source ZIP includes all
          tracked game code and assets at 63e5bd4474af7de43caa73381c1c9c061955a4af.
          Build dependencies and generated outputs are recreated by the Android workflow.
          The Android CI tests, package metadata, signature and ARM64 checks passed.
          Inbox reading still needs confirmation on a physical phone.
          EOF
          sha256sum OFMtouch-0.3.6-Build315-NightlyPreRelease.apk \
            OFMtouch-Build315-source.zip > OFMtouch-Build315-SHA256.txt
          zip -0 -q OFMtouch-Build315-complete.zip \
            OFMtouch-0.3.6-Build315-NightlyPreRelease.apk \
            OFMtouch-Build315-source.zip OFMtouch-Build315-SHA256.txt \
            OFMtouch-Build315-README.txt
          unzip -t OFMtouch-Build315-complete.zip | tail -n 1
          sha256sum OFMtouch-Build315-complete.zip >> OFMtouch-Build315-SHA256.txt

      - name: Publish prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.3.6-build315 \
            release/OFMtouch-0.3.6-Build315-NightlyPreRelease.apk \
            release/OFMtouch-Build315-source.zip \
            release/OFMtouch-Build315-complete.zip \
            release/OFMtouch-Build315-SHA256.txt \
            release/OFMtouch-Build315-README.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target 63e5bd4474af7de43caa73381c1c9c061955a4af \
            --title 'OFMtouch v0.3.6 Build 315 — Android ARM64' \
            --notes 'Full Android APK, matching complete source, combined package and checksums. Build 315 fixes the Inbox action memory use, Save placement and mobile date layout; physical-device confirmation remains pending.' \
            --prerelease
