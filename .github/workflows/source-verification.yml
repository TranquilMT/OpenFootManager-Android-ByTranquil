name: Source Verification
on:
  workflow_dispatch:
  push:
    branches: [main, android/migration]
concurrency:
  group: source-verification-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  frontend-and-database-validator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify database validator regression cases
        run: node --test scripts/validate-real-database.test.mjs
      - run: npm ci
      - run: npm run build
      - run: npm test -- --maxWorkers=2
